# Docker Compose - Production Environment
# Hệ thống Semantic Search + RAG Chatbot - 100% Offline Local

version: '3.8'

services:
  # ============================================
  # NGINX - Reverse Proxy & Load Balancer
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: hlv_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL certificates (optional)
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hlv_network

  # ============================================
  # OLLAMA - Local LLM (Thay thế OpenAI)
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: hlv_ollama
    restart: always
    ports:
      - "127.0.0.1:11434:11434"
      - "127.0.0.1:11436:11436"
    environment:
      CUDA_VISIBLE_DEVICES: "${CUDA_VISIBLE_DEVICES:-0}"
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-4}"
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-2}"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - hlv_network

  # ============================================
  # POSTGRESQL - Primary Database + pgvector
  # ============================================
  postgresql:
    image: pgvector/pgvector:pg16
    container_name: hlv_postgresql
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup:/backup
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - postgres
      - -c max_connections=200
      - -c shared_buffers=512MB
      - -c effective_cache_size=1GB
      - -c maintenance_work_mem=128MB
      - -c checkpoint_completion_target=0.9
      - -c wal_buffers=16MB
      - -c default_statistics_target=100
      - -c random_page_cost=1.1
      - -c effective_io_concurrency=200
      - -c work_mem=4MB
      - -c min_wal_size=1GB
      - -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hlv_network

  # ============================================
  # REDIS - Cache và Session Store
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: hlv_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hlv_network

  # ============================================
  # MINIO - Object Storage (S3-compatible)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: hlv_minio
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - hlv_network

  # ============================================
  # BACKEND - .NET 8 API (Production)
  # ============================================
  backend:
    image: ${DOCKER_REGISTRY:-}aibf-backend:${IMAGE_TAG:-latest}
    container_name: hlv_backend
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5000"
      # Database
      ConnectionStrings__DefaultConnection: "Host=postgresql;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      # Redis
      ConnectionStrings__Redis: "redis://:${REDIS_PASSWORD}@redis:6379"
      # MinIO
      MinIOConfig__Endpoint: "minio:9000"
      MinIOConfig__AccessKey: "${MINIO_ROOT_USER}"
      MinIOConfig__SecretKey: "${MINIO_ROOT_PASSWORD}"
      MinIOConfig__BucketName: "${MINIO_BUCKET}"
      # Ollama
      OllamaConfig__BaseUrl: "http://ollama:11434"
      OllamaConfig__ChatModel: "${OLLAMA_CHAT_MODEL}"
      OllamaConfig__EmbeddingModel: "${OLLAMA_EMBEDDING_MODEL}"
      OllamaConfig__Temperature: "${OLLAMA_TEMPERATURE:-0.3}"
      OllamaConfig__MaxTokens: "${OLLAMA_MAX_TOKENS:-2000}"
      # JWT
      JwtConfig__Secret: "${JWT_SECRET}"
      JwtConfig__Issuer: "${JWT_ISSUER}"
      JwtConfig__Audience: "${JWT_AUDIENCE}"
      JwtConfig__ExpiryMinutes: "${JWT_EXPIRY_MINUTES:-60}"
      # Serilog
      Serilog__MinimumLevel__Default: Warning
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:5340"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - hlv_network

  # ============================================
  # FRONTEND - Next.js 14 (Production - Static)
  # ============================================
  frontend:
    image: ${DOCKER_REGISTRY:-}aibf-frontend:${IMAGE_TAG:-latest}
    container_name: hlv_frontend
    restart: always
    volumes:
      - ./nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hlv_network

  # ============================================
  # SEQ - Log Aggregation (Internal Only)
  # ============================================
  seq:
    image: datalust/seq:latest
    container_name: hlv_seq
    restart: always
    ports:
      - "127.0.0.1:5340:80"
      - "127.0.0.1:5341:5341"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "${SEQ_PASSWORD}"
      SEQ_API_BINDURL: "http://+:5341"
      SEQ_UI_BINDURL: "http://+:80"
    volumes:
      - seq_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hlv_network

# ============================================
# NETWORKS
# ============================================
networks:
  hlv_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================
# VOLUMES
# ============================================
volumes:
  ollama_data:
    name: hlv_ollama_data_prod
  postgres_data:
    name: hlv_postgres_data_prod
  redis_data:
    name: hlv_redis_data_prod
  minio_data:
    name: hlv_minio_data_prod
  seq_data:
    name: hlv_seq_data_prod
