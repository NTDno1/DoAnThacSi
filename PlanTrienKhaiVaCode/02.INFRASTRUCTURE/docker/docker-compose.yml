version: '3.8'

services:
  # ==========================================
  # BACKEND API
  # ==========================================
  backend:
    build:
      context: ./src/AIBaseFramework.API
      dockerfile: Dockerfile
    container_name: aibf-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    env_file:
      - .env
    volumes:
      - ./src/AIBaseFramework.API:/app
      - ~/.aspnet/https:/root/.aspnet/https:ro
    depends_on:
      - postgres
      - redis
      - ollama
    networks:
      - aibf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # FRONTEND (Next.js)
  # ==========================================
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: aibf-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_WS_URL=ws://localhost:5000
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - aibf-network
    restart: unless-stopped

  # ==========================================
  # POSTGRESQL + pgvector
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aibf-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-aibfuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aibfpass123}
      - POSTGRES_DB=${POSTGRES_DB:-aibaseframework}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - aibf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aibfuser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # REDIS
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: aibf-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    networks:
      - aibf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # OLLAMA (Local LLM)
  # ==========================================
  ollama:
    build:
      context: ./ollama
      dockerfile: Dockerfile
    container_name: aibf-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=2
    networks:
      - aibf-network
    restart: unless-stopped
    gpu_support: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ==========================================
  # MINIO (S3-compatible Storage)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: aibf-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - aibf-network
    restart: unless-stopped

  # ==========================================
  # NginX (Reverse Proxy)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: aibf-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - aibf-network
    restart: unless-stopped

  # ==========================================
  # SEQ (Structured Logging)
  # ==========================================
  seq:
    image: datalust/seq:latest
    container_name: aibf-seq
    ports:
      - "5340:80"
      - "5341:5341"
    environment:
      - ACCEPT_EULA=Y
    volumes:
      - seq_data:/data
    networks:
      - aibf-network
    restart: unless-stopped

# ==========================================
# NETWORKS
# ==========================================
networks:
  aibf-network:
    driver: bridge
    name: aibf-network

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data:
    name: aibf-postgres-data
  redis_data:
    name: aibf-redis-data
  ollama_data:
    name: aibf-ollama-data
  minio_data:
    name: aibf-minio-data
  seq_data:
    name: aibf-seq-data
